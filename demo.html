<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f9d55"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Rhyturn">
<title>Rhyturn 관제 (데모)</title><style>:root{--bg:#f2f7f3;--panel:#ffffff;--panel2:#eaf3ec;--line:#d3e3d7;--tx:#14261b;--mute:#5a7163;--acc:#1f9d55;--acc-tx:#ffffff;--acc-soft:#d9f0e1;--ok:#1f9d55;--warn:#b7791f;--bad:#d1363a;--off:#93a69a;--shadow:0 6px 20px rgba(24,70,40,.10)}
:root[data-theme=dark]{--bg:#0e1612;--panel:#16211b;--panel2:#1d2c24;--line:#2b4034;--tx:#e6f2ea;--mute:#8fa898;--acc:#4ade80;--acc-tx:#06210f;--acc-soft:#1f4a31;--ok:#4ade80;--warn:#f5b73b;--bad:#ff6b6b;--off:#5f7367;--shadow:0 6px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:"Pretendard","Noto Sans KR",system-ui,-apple-system,sans-serif;font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:600;color:var(--tx)}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-tx)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.on{border-color:var(--acc);color:var(--acc);background:var(--acc-soft)}
input,select{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:19px;letter-spacing:.2px}.logo i{font-style:normal;color:var(--acc)}
.sums{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;background:var(--acc-soft);font-weight:600;font-size:13.5px}
.chip b{font-size:16px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--off);display:inline-block}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.sp{flex:1}
.conn{font-size:12.5px;color:var(--mute)}
/* alerts */
#alerts{position:sticky;top:57px;z-index:19}
.alert{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;background:var(--bad);color:#fff;font-weight:700;border-bottom:1px solid rgba(0,0,0,.2);animation:blink 1.2s infinite}
.alert.acked{background:#8a3b3b;animation:none}
.alert.absence{background:#b5790f}.alert.absence.acked{background:#6e5316}
.alert .btn{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.5);color:#fff}
.alert .ic{font-size:20px}
@keyframes blink{50%{filter:brightness(1.25)}}
/* grid */
main{padding:20px;max-width:1500px;margin:0 auto}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.bar h2{margin:0;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s;box-shadow:var(--shadow)}
.card:hover{transform:translateY(-2px);border-color:var(--acc)}
.card.alert-fall,.card.alert-absence{border-color:var(--bad);animation:pulse 1.3s infinite}
.card.alert-absence{border-color:var(--warn)}
.card.offline{opacity:.7}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(255,107,107,.3)}}
.thumb{position:relative;aspect-ratio:4/3;background:#000}
.thumb canvas,.thumb img{width:100%;height:100%;display:block;object-fit:cover}
.thumb .tag{position:absolute;top:8px;left:8px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;background:rgba(0,0,0,.6);color:#fff}
.thumb .tag.bad{background:var(--bad)}.thumb .tag.warn{background:var(--warn);color:#1a1200}
.thumb .sim{position:absolute;top:8px;right:8px;font-size:11px;background:rgba(0,0,0,.55);color:#bbb;padding:2px 7px;border-radius:6px}
.cbody{padding:11px 13px}
.chead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.chead strong{font-size:18px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:13px;color:var(--mute)}
.kv b{display:block;color:var(--tx);font-size:15px}
.bars{display:flex;gap:3px;height:6px;margin-top:10px}
.bars i{flex:1;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.bars i span{position:absolute;inset:0 auto 0 0;border-radius:3px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
.modal.open{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(1100px,100%);box-shadow:var(--shadow)}
.sheet header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.sheet header h3{margin:0;font-size:20px}
.sbody{display:grid;gap:18px;padding:18px;grid-template-columns:1fr}
@media(min-width:900px){.sbody{grid-template-columns:1.15fr 1fr}}
.video{background:#000;border-radius:12px;overflow:hidden;aspect-ratio:4/3;position:relative}
.video canvas,.video img{width:100%;height:100%;object-fit:contain;display:block}
.video .msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#9aa;font-weight:600;background:rgba(0,0,0,.7)}
.video.dead .msg{display:flex}
.sec{background:var(--panel2);border-radius:12px;padding:14px;margin-bottom:14px}
.sec h4{margin:0 0 10px;font-size:13.5px;color:var(--mute);font-weight:700}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rg .btn{font-size:13px;padding:9px 6px;text-align:left}
.rg .btn small{display:block;color:var(--mute);font-weight:500;font-size:11px}
.rg .btn.active{background:var(--acc);color:var(--acc-tx);border-color:var(--acc)}.rg .btn.active small{color:var(--acc-tx);opacity:.8}
.rg .btn.wide{grid-column:span 2;text-align:center}
.sl{display:flex;align-items:center;gap:10px;margin:10px 0}
.sl label{min-width:78px;font-size:13.5px;color:var(--mute)}.sl input{flex:1;accent-color:var(--acc)}.sl .v{min-width:44px;text-align:right;font-family:ui-monospace,monospace}
.cct{height:8px;border-radius:4px;background:linear-gradient(90deg,#ffb35c,#fff2dd,#cfe4ff);margin:-4px 0 6px 88px}
canvas.chart{width:100%;height:110px;display:block}
.log{max-height:150px;overflow:auto;font-size:13px;line-height:1.8;color:var(--mute)}
.log b{color:var(--tx);font-weight:600}
details summary{cursor:pointer;font-size:13px;color:var(--mute);font-weight:700}
.lat{font-size:12px;color:var(--mute);margin-top:6px}
/* settings drop */
.pop{position:absolute;right:20px;top:58px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;width:300px;box-shadow:var(--shadow);display:none;z-index:40}
.pop.open{display:block}.pop h4{margin:0 0 8px;font-size:13px;color:var(--mute)}
.pop .row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:10px;font-size:14px;display:none;z-index:99}
/* login */
.lw{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.lc{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow)}
.lc h1{margin:0 0 4px;font-size:24px}.lc p{margin:0 0 20px;color:var(--mute);font-size:14px}
.lc label{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px}.lc input{width:100%}.lc .btn{width:100%;margin-top:18px;padding:12px}
.err{color:var(--bad);font-size:13.5px;margin-top:10px;min-height:18px}

/* ===== 태블릿 최적화 (기준: 10인치 1280x800 가로, 800x1280 세로, iPad 1024x768 / 1180x820) ===== */
html,body{height:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.top{position:relative;top:auto;flex:none}
#alerts{position:relative;top:auto;flex:none;max-height:30vh;overflow:auto}
main{flex:1;min-height:0;overflow:auto;width:100%;max-width:none;padding:14px 18px 18px;-webkit-overflow-scrolling:touch}
.btn,.btn.sm{min-height:44px}
.btn.sm{padding:8px 14px;font-size:14px}
select,input{min-height:44px}
.alert .btn{min-height:44px}
input[type=range]{-webkit-appearance:none;appearance:none;height:8px;border-radius:4px;background:var(--line);min-height:0;padding:0;border:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--acc);border:3px solid var(--panel);box-shadow:0 1px 5px rgba(0,0,0,.35)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--acc);border:3px solid var(--panel)}
.sl{margin:14px 0}
.grid{grid-template-columns:repeat(3,1fr);gap:12px}
.pop{top:62px;max-height:calc(100% - 80px);overflow:auto}
@media(min-width:900px) and (orientation:landscape){
  .grid{grid-template-columns:repeat(5,1fr);gap:12px}
  .thumb{aspect-ratio:16/10}
  .cbody{padding:9px 12px}
  .chead{margin-bottom:5px}
  .kv{gap:3px 8px;font-size:12px}.kv b{font-size:14px}
  .bars{margin-top:7px}
}
@media(min-width:600px) and (max-width:899px),(orientation:portrait){ .grid{grid-template-columns:repeat(3,1fr)} }
@media(max-width:599px){ .grid{grid-template-columns:repeat(2,1fr)} .top{padding:10px 12px} }
/* 호실 상세: 태블릿에서는 전체 화면 시트 */
@media(max-width:1500px){
  .modal{padding:0;align-items:stretch;overflow:hidden}
  .sheet{width:100%;height:100%;border-radius:0;border:0;display:flex;flex-direction:column;overflow:hidden}
  .sheet header{flex:none;padding:12px 18px}
  .sheet header .btn{min-height:48px;min-width:96px;font-size:16px}
  .sbody{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
}
@media(min-width:900px) and (orientation:landscape){
  .sbody{grid-template-columns:1.1fr 1fr;overflow:hidden}
  .sbody>div{overflow:auto;min-height:0}
}
.rg .btn{min-height:52px}
@media(hover:none){.card:hover{transform:none;border-color:var(--line)}.card:active{transform:scale(.99)}}
@media(display-mode:standalone),(display-mode:fullscreen){.top{padding-top:10px}}
@media(orientation:portrait){.video{aspect-ratio:auto;height:34vh;min-height:220px}}
</style></head>
<body>
<div class="top">
  <div class="logo"><i>Rhy</i>turn</div>
  <div class="sums" id="sums"></div>
  <div class="sp"></div>
  <span class="conn" id="conn">연결 중…</span>
  <button class="btn sm" id="snd" title="경고음">🔔 경고음</button>
  <button class="btn sm" id="setb">설정</button>
  <button class="btn sm" id="out">로그아웃</button>
</div>
<div class="pop" id="pop">
  <h4>부재 경고 기준 (분)</h4><div class="row"><input id="absMin" type="number" min="1" max="1440" style="width:90px"><button class="btn sm primary" id="saveSet">저장</button></div>
  <h4>테마</h4><div class="row"><button class="btn sm" id="theme">라이트/다크 전환</button></div>
  <div id="simTools"><h4>시연 도구 (시뮬레이션 호실)</h4>
  <div class="row"><select id="simRoom"></select></div>
  <div class="row"><button class="btn sm" data-sim="fall">낙상 발생</button><button class="btn sm" data-sim="absence">장시간 부재</button><button class="btn sm" data-sim="offline">오프라인 토글</button></div></div>
</div>
<div id="alerts"></div>
<main>
  <div class="bar"><h2>호실 현황</h2><span class="conn" id="cnt"></span><div class="sp"></div>
    <span class="conn">전체 호실 적용</span><select id="allR"></select><button class="btn sm" id="allGo">적용</button></div>
  <div class="grid" id="grid"></div>
</main>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>// 브라우저 안에서 동작하는 데모용 시뮬레이터 (서버/ESP32 없이 화면·기능 확인용)
window.DEMO = (() => {
  const RH = [['기상 유도','Dawn',[22,24,4,26]],['아침 각성','Morning',[76,23,27,26]],['주간 피크','Daytime',[132,33,61,28]],['정오','Midday',[106,26,49,22]],['오후 활동','Afternoon',[89,26,32,30]],['일몰 전환','Wind-down',[51,31,12,31]],['저녁','Evening',[26,23,6,23]],['취침 준비','Pre-sleep',[11,13,2,13]],['야간 수면','Night',[1,1,0,1]],['야간 이동','Night nav',[1,5,0,5]]];
  const RHYTHMS = RH.map(([name, en, ch]) => ({ name, en, ch }));
  let settings = { absenceMinutes: 30, soundOn: true }, events = [], cb = () => {};
  const rooms = [], target = {};
  const init = [2, 2, 3, 2, 1, 4, 2, 8, 2, 5];
  const lux = (r) => Math.max(0, Math.round((r.ch[0]*.9 + r.ch[1]*.6 + r.ch[2]*.5 + r.ch[3]*.3) * 1.1 + (Math.random() - .5) * 4));
  for (let i = 1; i <= 10; i++) { const r = { id: String(100 + i), name: (100 + i) + '호', mode: 'sim', online: true, rhythm: init[i-1], ch: [...RHYTHMS[init[i-1]].ch], luxHist: [], present: true, absentSince: null, fps: 9, rssi: -55, alert: null, fallPose: false, lastSeen: Date.now() }; r.lux = lux(r); rooms.push(r); }
  rooms[6].online = false;
  const get = (id) => rooms.find((r) => r.id === id);
  const ev = (room, type, msg) => { const e = { t: Date.now(), room, type, msg }; events.unshift(e); cb({ type: 'event', event: e }); };
  const raise = (r, type) => { if (r.alert?.type === type) return; r.alert = { type, since: Date.now(), acked: false }; ev(r.id, type, type === 'fall' ? `${r.name} 낙상 의심 감지` : `${r.name} 장시간 부재 감지`); };
  const present = (r, p, fall) => { r.present = p; if (p) { r.absentSince = null; if (r.alert?.type === 'absence') { ev(r.id, 'info', `${r.name} 경고 해제 (재실 확인)`); r.alert = null; } } else if (!r.absentSince) r.absentSince = Date.now(); if (fall) raise(r, 'fall'); };
  setInterval(() => rooms.forEach((r) => {
    if (!r.online) return;
    const t = target[r.id]; if (t) for (let i = 0; i < 4; i++) { const d = t[i] - r.ch[i]; r.ch[i] += Math.sign(d) * Math.min(Math.abs(d), 12); }
    r.lux = lux(r); r.fps = 8 + Math.round(Math.random() * 2); r.rssi = -50 - Math.round(Math.random() * 15);
    if (!r.present && r.absentSince && Date.now() - r.absentSince > settings.absenceMinutes * 60e3) raise(r, 'absence');
    if (Math.random() < .002 && r.present && !r.alert) present(r, false); else if (!r.present && !r.alert && Math.random() < .06) present(r, true);
  }), 500);
  setInterval(() => rooms.forEach((r) => { r.luxHist.push(r.lux); if (r.luxHist.length > 90) r.luxHist.shift(); }), 2000);
  rooms.forEach((r) => { for (let i = 0; i < 30; i++) r.luxHist.push(r.lux + Math.round((Math.random() - .5) * 6)); });
  const rhy = (r, id) => { r.rhythm = id; target[r.id] = id < 0 ? [0,0,0,0] : [...RHYTHMS[id].ch]; };
  const label = (id) => id < 0 ? '소등' : RHYTHMS[id].name;
  async function api(path, b) {
    await new Promise((res) => setTimeout(res, 15)); let m;
    if (path === '/api/meta') return { rhythms: RHYTHMS, rooms: 10, sim: true };
    if (path === '/api/events') return events.slice(0, 100);
    if ((m = path.match(/^\/api\/rooms\/(\d+)\/rhythm$/))) { const r = get(m[1]); rhy(r, b.id); ev(r.id, 'control', `${r.name} 리듬: ${label(b.id)}`); return { ok: true }; }
    if ((m = path.match(/^\/api\/rooms\/(\d+)\/set$/))) { const r = get(m[1]); r.rhythm = -2; const t = target[r.id] || [...r.ch]; t[b.ch] = b.val; target[r.id] = t; return { ok: true }; }
    if ((m = path.match(/^\/api\/rooms\/(\d+)\/ack$/))) { const r = get(m[1]); if (r.alert) { r.alert.acked = true; ev(r.id, 'info', `${r.name} 경고 확인 처리`); } return { ok: true }; }
    if ((m = path.match(/^\/api\/rooms\/(\d+)\/resolve$/))) { const r = get(m[1]); r.fallPose = false; if (!r.present) present(r, true); if (r.alert) { ev(r.id, 'info', `${r.name} 경고 해제 (관리자 조치 완료)`); r.alert = null; } return { ok: true }; }
    if (path === '/api/all/rhythm') { rooms.forEach((r) => r.online && rhy(r, b.id)); ev('all', 'control', `전체 호실 리듬: ${label(b.id)}`); return { ok: true }; }
    if (path === '/api/settings') { settings = { absenceMinutes: Math.min(1440, Math.max(1, +b.absenceMinutes || 30)), soundOn: !!b.soundOn }; return settings; }
    if (path === '/api/sim/event') { const r = get(String(b.room)); if (b.type === 'fall') { r.fallPose = true; present(r, true, true); } if (b.type === 'absence') { present(r, false); r.absentSince = Date.now() - settings.absenceMinutes * 60e3 - 1000; } if (b.type === 'offline') { r.online = !r.online; ev(r.id, r.online ? 'info' : 'offline', `${r.name} ${r.online ? '장치 재연결' : '장치 연결 끊김'}`); } return { ok: true }; }
    return {};
  }
  function start(f) { cb = f; const push = () => f({ type: 'rooms', rooms: JSON.parse(JSON.stringify(rooms)).map((r) => ({ ...r, ch: r.ch.map(Math.round) })), settings, t: Date.now() }); push(); setInterval(push, 500); }
  return { api, start };
})();
</script>
<script>const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let RHYTHMS = [], rooms = [], settings = { absenceMinutes: 30, soundOn: true }, events = [], openId = null, ws, wsOk = false;
const CH = [{ n: 'D0 Green', c: '#4ade80' }, { n: 'D1 Yellow', c: '#facc15' }, { n: 'D2 Blue', c: '#60a5fa' }, { n: 'D3 Red', c: '#f87171' }];
const LS = { get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

function toast(m) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = 'none'), 2500); }
async function api(path, body) {
  if (window.DEMO) return window.DEMO.api(path, body);
  const r = await fetch(path, body === undefined ? {} : { method: 'POST', body: JSON.stringify(body) });
  if (r.status === 401) { location.href = '/login.html'; throw 0; }
  if (!r.ok) { toast('요청 실패'); throw 0; }
  return r.json();
}
const status = (r) => !r.online ? 'off' : r.alert?.type === 'fall' ? 'bad' : r.alert ? 'warn' : 'ok';
const STX = { off: '오프라인', bad: '낙상 의심', warn: '장시간 부재', ok: '정상' };
const rhName = (r) => (r.rhythm >= 0 ? RHYTHMS[r.rhythm].name : r.rhythm === -1 ? '소등' : '수동 조절');
const mmss = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return s >= 3600 ? `${Math.floor(s / 3600)}시간 ${Math.floor((s % 3600) / 60)}분` : `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };

// ---------- 시뮬레이션 영상(장치 없는 호실) ----------
function drawScene(cv, r) {
  const w = cv.width = 320, h = cv.height = 240, g = cv.getContext('2d');
  g.fillStyle = r.online ? '#FAF4C0' : '#e9e6d6'; g.fillRect(0, 0, w, h);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = r.online ? '#7a5c00' : '#8d887a'; g.font = '700 64px "Noto Sans KR",sans-serif'; g.fillText(r.name, w / 2, h / 2 - 8);
  g.font = '500 16px "Noto Sans KR",sans-serif'; g.fillStyle = r.online ? '#9a7b12' : '#a09b8c'; g.fillText(r.online ? '카메라 영상 영역' : '신호 없음', w / 2, h / 2 + 40);
}
const isRealCam = (r) => r.mode === 'device';

// ---------- 상단 ----------
function renderTop() {
  const c = { ok: 0, warn: 0, bad: 0, off: 0 }; rooms.forEach((r) => c[status(r)]++);
  $('#sums').innerHTML = `<span class="chip"><span class="dot ok"></span>정상 <b>${c.ok}</b></span><span class="chip"><span class="dot warn"></span>주의 <b>${c.warn}</b></span><span class="chip"><span class="dot bad"></span>경고 <b>${c.bad}</b></span><span class="chip"><span class="dot"></span>오프라인 <b>${c.off}</b></span>`;
  $('#cnt').textContent = `총 ${rooms.length}개 호실`;
  $('#snd').classList.toggle('on', settings.soundOn); $('#snd').textContent = settings.soundOn ? '🔔 경고음 켜짐' : '🔕 경고음 꺼짐';
}
function renderAlerts() {
  const list = rooms.filter((r) => r.alert).sort((a, b) => a.alert.since - b.alert.since);
  $('#alerts').innerHTML = list.map((r) => `<div class="alert ${r.alert.type} ${r.alert.acked ? 'acked' : ''}" data-r="${r.id}">
    <span class="ic">${r.alert.type === 'fall' ? '🚨' : '⚠️'}</span><span>${r.name} ${r.alert.type === 'fall' ? '낙상 의심' : '장시간 부재'} · ${mmss(Date.now() - r.alert.since)} 경과${r.alert.acked ? ' (확인됨)' : ''}</span><span class="sp" style="flex:1"></span>
    <button class="btn sm" data-a="view">영상 보기</button>${r.alert.acked ? '' : '<button class="btn sm" data-a="ack">확인</button>'}<button class="btn sm" data-a="resolve">조치 완료</button></div>`).join('');
}
$('#alerts').onclick = async (e) => {
  const b = e.target.closest('button'); if (!b) return; const id = b.closest('.alert').dataset.r;
  if (b.dataset.a === 'view') openRoom(id); else await api(`/api/rooms/${id}/${b.dataset.a}`, {});
};

// ---------- 카드 그리드 ----------
function cardHTML(r) {
  const s = status(r); const dc = { ok: 'ok', warn: 'warn', bad: 'bad', off: '' }[s];
  const bars = r.ch.map((v, i) => `<i><span style="width:${Math.min(100, v / 160 * 100)}%;background:${CH[i].c}"></span></i>`).join('');
  return `<div class="card ${r.alert ? 'alert-' + r.alert.type : ''} ${r.online ? '' : 'offline'}" data-r="${r.id}">
  <div class="thumb">${isRealCam(r) ? `<img alt="" data-th="${r.id}">` : `<canvas data-cv="${r.id}"></canvas><span class="sim">시뮬레이션</span>`}
    ${r.alert ? `<span class="tag ${r.alert.type === 'fall' ? 'bad' : 'warn'}">${r.alert.type === 'fall' ? '🚨 낙상 의심' : '⚠ 장시간 부재'}</span>` : ''}</div>
  <div class="cbody"><div class="chead"><strong>${esc(r.name)}</strong><span class="st"><span class="dot ${dc}"></span>${STX[s]}</span></div>
  <div class="kv"><div>조도<b>${r.online ? r.lux + ' lx' : '-'}</b></div><div>재실<b>${!r.online ? '-' : r.present ? '재실' : '부재 ' + mmss(Date.now() - r.absentSince)}</b></div>
  <div style="grid-column:span 2">조명<b>${r.online ? esc(rhName(r)) : '-'}</b></div></div><div class="bars">${bars}</div></div></div>`;
}
function renderGrid() {
  const order = (r) => (r.alert && !r.alert.acked ? 0 : r.alert ? 1 : r.online ? 2 : 3);
  const sorted = [...rooms].sort((a, b) => order(a) - order(b) || a.id - b.id);
  const g = $('#grid'); const sig = sorted.map((r) => r.id + status(r) + r.mode).join();
  if (g.dataset.sig !== sig) { g.innerHTML = sorted.map(cardHTML).join(''); g.dataset.sig = sig; }
  else sorted.forEach((r) => { const el = g.querySelector(`[data-r="${r.id}"]`); const t = document.createElement('div'); t.innerHTML = cardHTML(r); const n = t.firstElementChild;
    el.querySelector('.cbody').replaceWith(n.querySelector('.cbody')); });
  g.querySelectorAll('canvas[data-cv]').forEach((cv) => drawScene(cv, rooms.find((r) => r.id === cv.dataset.cv)));
}
$('#grid').onclick = (e) => { const c = e.target.closest('.card'); if (c) openRoom(c.dataset.r); };
setInterval(() => { document.querySelectorAll('img[data-th]').forEach((im) => { const u = `/api/rooms/${im.dataset.th}/thumb?t=${Date.now()}`; const t = new Image(); t.onload = () => (im.src = u); t.src = u; }); }, 2000);

// ---------- 상세 모달 ----------
const ROWH = (r) => `<div class="video" id="vid">${isRealCam(r) ? `<img id="vimg" alt="">` : '<canvas id="vcv"></canvas>'}<div class="msg">영상 없음 · 장치 오프라인</div></div><div class="lat" id="lat"></div>
<div class="sec" style="margin-top:12px"><h4>조도 추이 (BH1750 · 최근 3분)</h4><canvas class="chart" id="chart"></canvas></div>
<div class="sec"><h4>호실 이벤트</h4><div class="log" id="elog"></div></div>`;
function openRoom(id) {
  const r = rooms.find((x) => x.id === id); if (!r) return; openId = id;
  $('#sheet').innerHTML = `<header><h3>${esc(r.name)}</h3><span class="st" id="mst"></span><span class="sp" style="flex:1"></span><span id="mact"></span><button class="btn sm" id="close">닫기 ✕</button></header>
  <div class="sbody"><div>${ROWH(r)}</div><div>
   <div class="sec"><h4>간단 조절</h4>
    <div class="sl"><label>밝기</label><input type="range" id="bri" min="0" max="100" value="${LS.get('bri' + id, 50)}"><span class="v" id="briV"></span></div>
    <div class="cct"></div><div class="sl"><label>색온도</label><input type="range" id="cct" min="0" max="100" value="${LS.get('cct' + id, 30)}"><span class="v" id="cctV"></span></div></div>
   <div class="sec"><h4>생체리듬 모드</h4><div class="rg" id="rg">${RHYTHMS.map((h, i) => `<button class="btn" data-i="${i}">${h.name}<small>${h.en}</small></button>`).join('')}<button class="btn danger wide" data-i="-1">전체 소등</button></div></div>
   <div class="sec"><details><summary>채널 직접 조절 (전문가)</summary>${CH.map((c, i) => `<div class="sl"><label><span class="dot" style="background:${c.c}"></span> ${c.n}</label><input type="range" min="0" max="255" id="s${i}"><span class="v" id="v${i}">0</span></div>`).join('')}</details></div>
  </div></div>`;
  $('#modal').classList.add('open'); $('#close').onclick = closeRoom;
  const vimg = $('#vimg'); if (vimg) { vimg.onerror = () => { $('#vid').classList.add('dead'); setTimeout(() => openId && (vimg.src = `/api/rooms/${id}/stream?t=${Date.now()}`), 2000); }; vimg.onload = () => $('#vid').classList.remove('dead'); vimg.src = `/api/rooms/${id}/stream`; } // 끊김 시 자동 재연결
  const simple = () => {
    const b = +$('#bri').value, t = +$('#cct').value; $('#briV').textContent = b + '%'; $('#cctV').textContent = t < 34 ? '따뜻함' : t < 67 ? '중간' : '차가움';
    LS.set('bri' + id, b); LS.set('cct' + id, t); const m = t / 100, warm = [.35, 1, 0, .9], cool = [1, .25, 1, .1], mx = [160, 70, 90, 60];
    return warm.map((w, i) => Math.round((w * (1 - m) + cool[i] * m) * mx[i] * b / 100));
  };
  let timer; const pushAll = () => { const v = simple(); clearTimeout(timer); timer = setTimeout(() => v.forEach((x, i) => api(`/api/rooms/${id}/set`, { ch: i, val: x })), 120); };
  $('#bri').oninput = $('#cct').oninput = pushAll; simple();
  $('#rg').onclick = async (e) => { const b = e.target.closest('button'); if (!b) return; const t0 = performance.now(); await api(`/api/rooms/${id}/rhythm`, { id: +b.dataset.i }); $('#lat').textContent = `명령 응답 ${Math.round(performance.now() - t0)} ms (목표: 1초 이내)`; };
  for (let i = 0; i < 4; i++) { let t; $('#s' + i).oninput = (e) => { $('#v' + i).textContent = e.target.value; clearTimeout(t); t = setTimeout(() => api(`/api/rooms/${id}/set`, { ch: i, val: +e.target.value }), 60); dragUntil = Date.now() + 1500; }; }
  refreshModal();
}
let dragUntil = 0;
function closeRoom() { openId = null; $('#modal').classList.remove('open'); $('#sheet').innerHTML = ''; }
$('#modal').onclick = (e) => { if (e.target.id === 'modal') closeRoom(); };
document.addEventListener('keydown', (e) => e.key === 'Escape' && closeRoom());

function refreshModal() {
  if (!openId) return; const r = rooms.find((x) => x.id === openId); if (!r) return; const s = status(r);
  $('#mst').innerHTML = `<span class="dot ${{ ok: 'ok', warn: 'warn', bad: 'bad', off: '' }[s]}"></span>${STX[s]} · ${r.online ? `조도 ${r.lux} lx · ${r.present ? '재실' : '부재'}` : ''}${r.rssi ? ` · Wi-Fi ${r.rssi} dBm` : ''}`;
  $('#mact').innerHTML = r.alert ? `${r.alert.acked ? '' : '<button class="btn sm danger" data-a="ack">확인</button> '}<button class="btn sm" data-a="resolve">조치 완료</button>` : '';
  $('#mact').onclick = async (e) => { const b = e.target.closest('button'); if (b) await api(`/api/rooms/${openId}/${b.dataset.a}`, {}); };
  $('#rg').querySelectorAll('button').forEach((b) => b.classList.toggle('active', +b.dataset.i === r.rhythm));
  if (Date.now() > dragUntil) r.ch.forEach((v, i) => { $('#s' + i).value = v; $('#v' + i).textContent = v; });
  if (!isRealCam(r)) { drawScene($('#vcv'), r); $('#vid').classList.toggle('dead', !r.online); } else if (!r.online) $('#vid').classList.add('dead');
  drawChart($('#chart'), r.luxHist);
  $('#elog').innerHTML = events.filter((e) => e.room === openId || e.room === 'all').slice(0, 30).map((e) => `${new Date(e.t).toLocaleTimeString('ko-KR')} · <b>${esc(e.msg)}</b>`).join('<br>') || '이벤트 없음';
}
function drawChart(cv, d) {
  const dpr = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight; cv.width = w * dpr; cv.height = h * dpr; const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement), acc = css.getPropertyValue('--acc'), line = css.getPropertyValue('--line'), mute = css.getPropertyValue('--mute');
  const max = Math.max(50, ...d) * 1.15; g.strokeStyle = line; g.lineWidth = 1; g.fillStyle = mute; g.font = '11px sans-serif';
  [0, .5, 1].forEach((f) => { const y = h - 14 - f * (h - 22); g.beginPath(); g.moveTo(34, y); g.lineTo(w, y); g.stroke(); g.fillText(Math.round(max * f), 2, y + 4); });
  if (d.length < 2) return; g.strokeStyle = acc; g.lineWidth = 2; g.beginPath();
  d.forEach((v, i) => { const x = 34 + i / (d.length - 1) * (w - 38), y = h - 14 - v / max * (h - 22); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke();
}

// ---------- 소리 ----------
let actx; document.addEventListener('click', () => { try { actx = actx || new AudioContext(); actx.resume(); } catch {} }, { once: false });
function beep(f = 880) { if (!actx || actx.state !== 'running') return; const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; g.gain.value = .15; o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + .25); }
setInterval(() => { if (settings.soundOn && rooms.some((r) => r.alert && !r.alert.acked)) { beep(rooms.some((r) => r.alert?.type === 'fall' && !r.alert.acked) ? 988 : 660); } }, 2500);

// ---------- 설정/상단 버튼 ----------
$('#setb').onclick = () => { $('#absMin').value = settings.absenceMinutes; $('#pop').classList.toggle('open'); };
$('#saveSet').onclick = async () => { settings = await api('/api/settings', { absenceMinutes: +$('#absMin').value, soundOn: settings.soundOn }); toast('저장됨'); };
$('#snd').onclick = async () => { settings = await api('/api/settings', { absenceMinutes: settings.absenceMinutes, soundOn: !settings.soundOn }); renderTop(); };
$('#out').onclick = async () => { if (window.DEMO) return toast('데모 화면에서는 로그아웃이 없습니다'); await fetch('/api/logout'); location.href = '/login.html'; };
$('#theme').onclick = () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = t; LS.set('theme', t); };
document.documentElement.dataset.theme = LS.get('theme', 'light');
document.querySelectorAll('[data-sim]').forEach((b) => (b.onclick = () => api('/api/sim/event', { room: $('#simRoom').value, type: b.dataset.sim })));
$('#allGo').onclick = async () => { const v = +$('#allR').value; if (confirm(`온라인 전체 호실에 '${v < 0 ? '전체 소등' : RHYTHMS[v].name}'을(를) 적용할까요?`)) { await api('/api/all/rhythm', { id: v }); toast('전체 적용됨'); } };

// ---------- 실시간 연결 ----------
function connect() {
  if (window.DEMO) { $('#conn').textContent = '● 데모 (시뮬레이션)'; $('#conn').style.color = 'var(--ok)'; return window.DEMO.start((m) => { if (m.type === 'rooms') { rooms = m.rooms; settings = m.settings; renderTop(); renderAlerts(); renderGrid(); refreshModal(); } else if (m.type === 'event') { events.unshift(m.event); events.length = Math.min(events.length, 200); } }); }
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/ui');
  ws.onopen = () => { wsOk = true; $('#conn').textContent = '● 실시간 연결됨'; $('#conn').style.color = 'var(--ok)'; };
  ws.onmessage = (e) => { const m = JSON.parse(e.data);
    if (m.type === 'rooms') { rooms = m.rooms; settings = m.settings; renderTop(); renderAlerts(); renderGrid(); refreshModal(); }
    else if (m.type === 'event') { events.unshift(m.event); events.length = Math.min(events.length, 200); } };
  ws.onclose = () => { wsOk = false; $('#conn').textContent = '○ 재연결 중…'; $('#conn').style.color = 'var(--bad)'; setTimeout(connect, 1500); };
}
(async () => {
  const meta = await api('/api/meta'); RHYTHMS = meta.rhythms; events = await api('/api/events');
  $('#allR').innerHTML = RHYTHMS.map((h, i) => `<option value="${i}">${h.name}</option>`).join('') + '<option value="-1">전체 소등</option>';
  $('#simRoom').innerHTML = Array.from({ length: meta.rooms }, (_, i) => `<option>${101 + i}</option>`).join('');
  $('#simTools').style.display = meta.sim ? '' : 'none';
  connect(); keepAwake();
})();
setInterval(() => { if (rooms.length) renderAlerts(); }, 1000);

// 관제 태블릿 화면 꺼짐 방지
let wl; async function keepAwake() { try { wl = await navigator.wakeLock?.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && keepAwake());
</script>
</body></html>
