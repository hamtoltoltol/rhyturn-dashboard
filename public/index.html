<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f855a"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Rhyturn">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><link rel="apple-touch-icon" href="/icon-192.png">
<title>Rhyturn 관제</title><link rel="stylesheet" href="/style.css"></head>
<body>
<nav class="rail" id="rail">
  <div class="logo"><i>Rhy</i>turn</div>
  <button class="nav" data-go="/"><b>▦</b>현황<span class="bd" data-bd="board"></span></button>
  <button class="nav" data-go="/alerts"><b>🔔</b>알람<span class="bd" data-bd="alerts"></span></button>
  <button class="nav" data-go="/system"><b>▣</b>시스템<span class="bd" data-bd="sys" style="background:var(--sys)"></span></button>
  <button class="nav" data-go="/log"><b>≣</b>로그</button>
  <div class="sp"></div>
  <button class="nav" data-go="/settings"><b>⚙</b>설정</button>
</nav>
<div class="stage">
  <header class="top"><h1 id="fname">가온요양원</h1><span class="sub" id="clock"></span><span class="sp"></span><span class="conn" id="conn">연결 중…</span></header>
  <div id="banner"></div>
  <main id="view"></main>
</div>
<div class="toast" id="toast"></div>
<script src="/engine.js"></script>
<script src="/app.js"></script>
<script>if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("/sw.js").catch(()=>{})</script>
</body></html>
